    <meta property="og:description" content="High-tech solutions, wherever you live." />

    <meta name="twitter:card" content="summary_large_image" />

      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@500;700&family=Outfit:wght@400;500;600;700&display=swap"

    />
    <link rel="stylesheet" href="styles.css?v=earth28" />
    <title>Range Road Technologies. High-tech solutions, wherever you live.</title>
  </head>
  <body class="theme-rr page-home">
    <a class="skip" href="#main">Skip to content</a>

    <div class="lamp" aria-hidden="true"></div>
    <div class="felt-grain" aria-hidden="true"></div>

    <!-- Restore the site nav here once there is more than one public page. -->

    <main id="main">
      <section class="hero">
        <h1 class="sr-only">Range Road Technologies</h1>
        <img
          class="brand-logo"
          src="media/range-road-logo.jpg?v=3"
          width="1256"
          height="830"
          alt="Range Road Technologies — dirt road becoming pavement becoming code"
        />
        <p class="hero-tagline">High-tech solutions, <span class="nowrap">wherever you live.</span></p>
        <p class="pitch">Tell us what you need and we'll make it work.</p>
        <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
          <input type="hidden" name="access_key" value="12f134db-e1d3-4f4b-aafd-f869d0c94de0" />
          <input type="hidden" name="subject" value="New message from rangeroadtech.com" />
          <input type="hidden" name="from_name" value="Range Road Technologies website" />
          <div class="botcheck" aria-hidden="true">
            <label>
              <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" />
              Leave this unchecked
            </label>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="contact-name">Name</label>
              <input id="contact-name" name="name" type="text" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="contact-email">Email</label>
              <input id="contact-email" name="email" type="email" autocomplete="email" required />
            </div>
          </div>
          <div class="field">
            <label for="contact-phone">Phone (optional)</label>
            <input id="contact-phone" name="phone" type="tel" autocomplete="tel" />
          </div>
          <div class="field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="5" required></textarea>
          </div>
          <button class="cta" type="submit">Send</button>
          <p id="contact-status" class="form-status" role="status" aria-live="polite" hidden></p>
        </form>
      </section>
    </main>
    <script>
      const form = document.querySelector(".contact-form");
      const status = document.querySelector("#contact-status");
      const button = form.querySelector('button[type="submit"]');

      function showStatus(kind, node) {
        status.hidden = false;
        status.className = "form-status " + kind;
        status.replaceChildren(node);
      }

      function errorMessage() {
        const frag = document.createDocumentFragment();
        frag.append("We couldn't send that. Email ");
        const link = document.createElement("a");
        link.href = "mailto:help@rangeroadtech.com";
        link.textContent = "help@rangeroadtech.com";
        frag.append(link, " and we'll take it from there.");
        return frag;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        const data = new FormData(form);
        if (data.get("botcheck")) {
          showStatus("is-error", errorMessage());
          return;
        }
        button.disabled = true;
        status.hidden = true;
        try {
          const email = String(data.get("email") || "");
          const response = await fetch(form.action, {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({
              access_key: data.get("access_key"),
              subject: data.get("subject"),
              from_name: data.get("from_name"),
              name: data.get("name"),
              email,
              replyto: email,
              phone: data.get("phone") || "",
              message: data.get("message"),
              botcheck: ""
            })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || !result.success) throw new Error("send failed");
          form.reset();
          form.classList.add("is-sent");
          showStatus("is-ok", document.createTextNode("Thanks, we'll be in touch soon."));
        } catch (err) {
          showStatus("is-error", errorMessage());
        } finally {
          button.disabled = false;
        }
      });
    </script>

    <footer class="foot">
      <p class="foot-place">
        <span>Range Road Technologies</span>
        <span class="foot-serve">Serving rural Alberta and the world</span>
      </p>
      <p class="foot-credit">
        <a href="mailto:help@rangeroadtech.com">help@rangeroadtech.com</a>
      </p>
    </footer>
  </body>
</html>
